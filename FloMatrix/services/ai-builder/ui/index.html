<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>FloMatrix AI Builder Control Panel</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="assets/css/style.css" />
</head>
<body>
  <div id="app-root">
    <header class="fm-header">
      <div class="fm-header-left">
        <div class="fm-logo-mark">FM</div>
        <div class="fm-header-text">
          <h1>FloMatrix — AI Builder Control Panel</h1>
          <p>Mode C • Institutional AI Repair Pipeline</p>
        </div>
      </div>
      <div class="fm-header-right">
        <div class="fm-status-chip" id="backend-status-chip">
          <span class="dot dot-off"></span>
          <span id="backend-status-text">Checking backend…</span>
        </div>
        <button id="btn-refresh-all" class="fm-btn fm-btn-primary">
          Refresh All
        </button>
      </div>
    </header>

    <main class="fm-main-layout">
      <!-- LEFT: JOB LIST -->
      <section class="fm-panel fm-panel-left">
        <div class="fm-panel-header">
          <h2>Job Queue</h2>
          <div class="fm-panel-header-actions">
            <button id="btn-refresh-jobs" class="fm-btn fm-btn-ghost">
              Reload Jobs
            </button>
            <span class="fm-pill" id="jobs-count-pill">0 jobs</span>
          </div>
        </div>

        <div class="fm-panel-subheader">
          <input
            id="job-search-input"
            type="text"
            placeholder="Filter by id, status, repo, path…"
          />
        </div>

        <div id="jobs-list" class="fm-jobs-list">
          <!-- Populated by JS -->
        </div>
      </section>

      <!-- CENTER: JOB DETAILS + ACTIONS -->
      <section class="fm-panel fm-panel-center">
        <div class="fm-panel-header">
          <h2>Job Details</h2>
          <div class="fm-panel-header-actions">
            <span id="selected-job-id-label" class="fm-pill fm-pill-muted">
              No job selected
            </span>
          </div>
        </div>

        <div class="fm-job-meta-grid" id="job-meta-grid">
          <!-- Meta cards populated by JS -->
        </div>

        <div class="fm-job-actions">
          <button id="btn-approve-job" class="fm-btn fm-btn-success" disabled>
            ✅ Approve Patch
          </button>
          <button id="btn-reject-job" class="fm-btn fm-btn-danger" disabled>
            ❌ Reject Patch
          </button>
          <button id="btn-reload-selected" class="fm-btn fm-btn-ghost" disabled>
            🔄 Reload Selected
          </button>
        </div>

        <div class="fm-panel fm-subpanel">
          <div class="fm-subpanel-header">
            <h3>Job Timeline</h3>
          </div>
          <div id="job-timeline" class="fm-timeline">
            <!-- Populated by JS -->
          </div>
        </div>
      </section>

      <!-- RIGHT: LOGS + PATCH DIFF -->
      <section class="fm-panel fm-panel-right">
        <div class="fm-panel-tabs">
          <button
            class="fm-tab-button fm-tab-active"
            data-tab="logs"
            id="tab-logs-btn"
          >
            Logs
          </button>
          <button class="fm-tab-button" data-tab="diff" id="tab-diff-btn">
            Patch Diff
          </button>
        </div>

        <div class="fm-tab-content-wrapper">
          <div id="tab-logs" class="fm-tab-content fm-tab-active">
            <pre id="logs-output" class="fm-log-output">
No job selected yet.
            </pre>
          </div>

          <div id="tab-diff" class="fm-tab-content">
            <pre id="diff-output" class="fm-diff-output">
No patch diff loaded yet.
            </pre>
          </div>
        </div>
      </section>
    </main>

    <footer class="fm-footer">
      <div class="fm-footer-left">
        <span>FloMatrix AI Builder • Local Mode C</span>
      </div>
      <div class="fm-footer-right">
        <span id="auto-refresh-indicator">Auto-refresh: ON (15s)</span>
      </div>
    </footer>
  </div>

  <script src="assets/js/app.js"></script>
</body>
</html>
