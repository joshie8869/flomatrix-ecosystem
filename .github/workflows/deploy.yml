name: FloMatrix Auto-Deploy

on:
  push:
    branches: [ "main" ]

jobs:
  deploy:
    name: Deploy to FloMatrix VPS
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repo
      uses: actions/checkout@v3

    # -------------------------
    #  Connect to VPS
    # -------------------------
    - name: Setup SSH
      uses: webfactory/ssh-agent@v0.7.0
      with:
        ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

    - name: Add VPS to known hosts
      run: |
        ssh-keyscan -H ${{ secrets.SSH_HOST }} >> ~/.ssh/known_hosts

    # -------------------------
    #  UPLOAD & DEPLOY BACKEND
    # -------------------------
    - name: Upload backend code
      run: |
        rsync -avz --delete \
        FloMatrix/backend/ \
        ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:/var/www/flomatrix/backend/

    - name: Install backend dependencies
      run: |
        ssh ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} "
          cd /var/www/flomatrix &&
          source backend/venv/bin/activate &&
          pip install -r backend/requirements.txt
        "

    - name: Restart backend service
      run: |
        ssh ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} "
          systemctl daemon-reload &&
          systemctl restart flomatrix-backend
        "

    # -------------------------
    #  UPLOAD & DEPLOY FRONTEND
    # -------------------------
    - name: Upload frontend code
      run: |
        rsync -avz --delete \
        FloMatrix/app/ \
        ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:/var/www/flomatrix/frontend/

        rsync -avz --delete \
        FloMatrix/assets/ \
        ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:/var/www/flomatrix/frontend/assets/

    - name: Reload nginx
      run: |
        ssh ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} "
          systemctl reload nginx
        "

    # -------------------------
    #  HEALTH CHECK
    # -------------------------
    - name: Backend Health Check
      run: |
        ssh ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} "
          curl -f http://localhost:8000/health
        "
