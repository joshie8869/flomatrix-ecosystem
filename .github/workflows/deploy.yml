name: FloMatrix Auto-Deploy

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Deploy to FloMatrix VPS
    runs-on: ubuntu-latest

    env:
      SSH_HOST: ${{ secrets.SSH_HOST }}
      SSH_USER: ${{ secrets.SSH_USER }}
      PROJECT_ROOT: ${{ secrets.PROJECT_ROOT }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup SSH key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Deploy FloMatrix (frontend + backend)
        run: |
          set -e

          REMOTE_ROOT="$PROJECT_ROOT"

          echo ">>> Testing SSH connection..."
          ssh -o StrictHostKeyChecking=no "$SSH_USER@$SSH_HOST" "hostname && echo SSH_OK"

          echo ">>> Remote project root: $REMOTE_ROOT"

          echo ">>> Preparing temp deploy folder on server..."
          ssh "$SSH_USER@$SSH_HOST" "
            mkdir -p \"${REMOTE_ROOT}/tmp_from_github\" && \
            rm -rf \"${REMOTE_ROOT}/tmp_from_github\"/*
          "

          echo ">>> Creating deploy archive (excluding AnyChart installer bundle)..."
          # This archive includes the FloMatrix folder, but skips the heavy installer:
          #   FloMatrix/anychart-installation-package/**
          tar czf flomatrix_deploy.tgz \
            FloMatrix \
            --exclude='FloMatrix/anychart-installation-package'

          echo ">>> Uploading deploy archive to server..."
          scp flomatrix_deploy.tgz "$SSH_USER@$SSH_HOST:${REMOTE_ROOT}/tmp_from_github/"

          echo ">>> Expanding archive on server..."
          ssh "$SSH_USER@$SSH_HOST" "
            cd \"${REMOTE_ROOT}/tmp_from_github\" && \
            tar xzf flomatrix_deploy.tgz && \
            rm -f flomatrix_deploy.tgz
          "

          echo ">>> Syncing into live project directory..."
          ssh "$SSH_USER@$SSH_HOST" "
            cd \"${REMOTE_ROOT}\" && \
            rm -rf FloMatrix_old && \
            if [ -d FloMatrix ]; then mv FloMatrix FloMatrix_old; fi && \
            mv tmp_from_github/FloMatrix ./FloMatrix && \
            rm -rf tmp_from_github
          "

          echo ">>> Restarting backend service..."
          ssh "$SSH_USER@$SSH_HOST" "
            systemctl daemon-reload && \
            systemctl restart flomatrix-backend && \
            systemctl status flomatrix-backend -n 5 --no-pager || true
          "

          echo ">>> Reloading nginx..."
          ssh "$SSH_USER@$SSH_HOST" "
            systemctl reload nginx || systemctl restart nginx
          "

          echo ">>> FloMatrix deploy from GitHub Actions COMPLETE."
