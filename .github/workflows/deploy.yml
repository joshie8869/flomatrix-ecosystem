name: FloMatrix Auto-Deploy

on:
  push:
    branches: [ "main" ]

jobs:
  deploy:
    runs-on: ubuntu-latest

    env:
      SSH_HOST: ${{ secrets.SSH_HOST }}
      SSH_USER: ${{ secrets.SSH_USER }}

    steps:
      # 1) Checkout repo
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2) Set up SSH using the secret key
      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519

          ssh-keyscan -H "$SSH_HOST" >> ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      # 3) Deploy to VPS
      - name: Deploy FloMatrix (frontend + backend)
        run: |
          set -e

          REMOTE_ROOT="${{ secrets.PROJECT_ROOT }}"
          echo ">>> Testing SSH connection..."
          ssh -i ~/.ssh/id_ed25519 "$SSH_USER@$SSH_HOST" "hostname && echo SSH_OK"

          echo ">>> Remote project root: $REMOTE_ROOT"

          echo ">>> Creating temp deploy folder on server..."
          ssh -i ~/.ssh/id_ed25519 "$SSH_USER@$SSH_HOST" "mkdir -p \"$REMOTE_ROOT/tmp_from_github\""

          echo ">>> Uploading repo snapshot to server..."
          scp -i ~/.ssh/id_ed25519 -r ./FloMatrix "$SSH_USER@$SSH_HOST:\"$REMOTE_ROOT/tmp_from_github/FloMatrix\""

          echo ">>> Syncing into live project directory..."
          ssh -i ~/.ssh/id_ed25519 "$SSH_USER@$SSH_HOST" "
            cd \"$REMOTE_ROOT\" && \
            rm -rf FloMatrix_old && \
            if [ -d FloMatrix ]; then mv FloMatrix FloMatrix_old; fi && \
            mv tmp_from_github/FloMatrix ./FloMatrix && \
            rm -rf tmp_from_github
          "

          echo ">>> Restarting backend service..."
          ssh -i ~/.ssh/id_ed25519 "$SSH_USER@$SSH_HOST" "
            systemctl daemon-reload && \
            systemctl restart flomatrix-backend && \
            systemctl status flomatrix-backend -n 5 --no-pager || true
          "

          echo ">>> Reloading nginx..."
          ssh -i ~/.ssh/id_ed25519 "$SSH_USER@$SSH_HOST" "
            systemctl reload nginx || systemctl restart nginx
          "

          echo ">>> FloMatrix deploy from GitHub Actions COMPLETE."
