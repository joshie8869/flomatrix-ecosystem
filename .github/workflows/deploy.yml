name: FloMatrix Auto-Deploy

on:
  push:
    branches: [ "main" ]

jobs:
  deploy:
    name: Deploy to FloMatrix VPS
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.SSH_HOST }} >> ~/.ssh/known_hosts

      - name: Deploy FloMatrix (frontend + backend)
        run: |
          ssh ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} "cd /var/www/flomatrix && mkdir -p /tmp/deploy"

          echo "Uploading repository to VPS..."
          scp -r ./* ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:/tmp/deploy/

          ssh ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} "
            echo 'Applying deployment...'
            rm -rf /var/www/flomatrix/*
            mv /tmp/deploy/* /var/www/flomatrix/
            cd /var/www/flomatrix/backend
            source venv/bin/activate
            systemctl daemon-reload
            systemctl restart flomatrix-backend
            systemctl reload nginx
          "

      - name: Deployment Complete
        run: echo "FloMatrix CI/CD deployment finished successfully!"

